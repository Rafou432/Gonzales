<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" role="img" aria-labelledby="teamIllTitle">
  <title id="teamIllTitle">Illustration de l'équipe Goncalves et Fils devant un chantier</title>
  <defs>
    <pattern id="bricks2" width="40" height="20" patternUnits="userSpaceOnUse">
      <rect width="40" height="20" fill="#E4EFEC"/>
      <rect x="0" y="0" width="18" height="8" fill="#D5E5E1"/>
      <rect x="20" y="0" width="18" height="8" fill="#D5E5E1"/>
      <rect x="-9" y="10" width="18" height="8" fill="#D5E5E1"/>
      <rect x="11" y="10" width="18" height="8" fill="#D5E5E1"/>
      <rect x="31" y="10" width="18" height="8" fill="#D5E5E1"/>
    </pattern>
  </defs>

  <circle cx="260" cy="170" r="190" fill="#0B7574" opacity="0.10"/>

  <rect x="40" y="240" width="440" height="60" fill="url(#bricks2)" stroke="#0E9594" stroke-width="3"/>
  <line x1="40" y1="300" x2="480" y2="300" stroke="#1F2E2D" stroke-width="4" stroke-linecap="round"/>

  <!-- Personnage 1 -->
  <g transform="translate(150 130)">
    <circle cx="0" cy="0" r="26" fill="#F2C29E"/>
    <path d="M-26 -6 a26 26 0 0 1 52 0 v-4 a26 20 0 0 0 -52 0 Z" fill="#1F2E2D"/>
    <path d="M-40 130 v-58 a40 40 0 0 1 80 0 v58 Z" fill="#0E9594"/>
    <rect x="-40" y="72" width="80" height="14" fill="#3A8F57"/>
  </g>

  <!-- Personnage 2 (plus grand, au centre) -->
  <g transform="translate(260 108)">
    <circle cx="0" cy="0" r="30" fill="#E3A574"/>
    <path d="M-30 -8 a30 30 0 0 1 60 0 v-2 a30 22 0 0 0 -60 0 Z" fill="#3B2A20"/>
    <path d="M-46 150 v-66 a46 46 0 0 1 92 0 v66 Z" fill="#4CAF6D"/>
    <rect x="-46" y="82" width="92" height="16" fill="#3A8F57"/>
    <rect x="-10" y="40" width="20" height="30" rx="4" fill="#FFFFFF" opacity="0.85"/>
  </g>

  <!-- Personnage 3 -->
  <g transform="translate(370 134)">
    <circle cx="0" cy="0" r="25" fill="#8C5A3C"/>
    <path d="M-25 -20 a25 25 0 0 1 50 0 v10 a25 25 0 0 0 -50 0 Z" fill="#1F2E2D"/>
    <path d="M-38 124 v-56 a38 38 0 0 1 76 0 v56 Z" fill="#0B7574"/>
    <rect x="-38" y="68" width="76" height="13" fill="#0E9594"/>
  </g>

  <g fill="#4CAF6D">
    <circle cx="80" cy="90" r="5"/>
    <circle cx="450" cy="80" r="6"/>
    <circle cx="470" cy="200" r="5"/>
  </g>
</svg>
