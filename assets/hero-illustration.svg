<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" role="img" aria-labelledby="heroIllTitle">
  <title id="heroIllTitle">Illustration d'une maison en construction</title>
  <defs>
    <pattern id="bricks" width="46" height="24" patternUnits="userSpaceOnUse">
      <rect width="46" height="24" fill="#F4F9F8"/>
      <rect x="0" y="0" width="22" height="10" fill="#E4EFEC"/>
      <rect x="24" y="0" width="22" height="10" fill="#E4EFEC"/>
      <rect x="-11" y="12" width="22" height="10" fill="#E4EFEC"/>
      <rect x="13" y="12" width="22" height="10" fill="#E4EFEC"/>
      <rect x="35" y="12" width="22" height="10" fill="#E4EFEC"/>
    </pattern>
  </defs>

  <circle cx="260" cy="230" r="200" fill="#0B7574" opacity="0.16"/>
  <circle cx="330" cy="150" r="110" fill="#4CAF6D" opacity="0.18"/>

  <g>
    <rect x="110" y="220" width="240" height="160" fill="url(#bricks)" stroke="#0E9594" stroke-width="4"/>
    <polygon points="90,220 230,120 370,220" fill="#0E9594"/>
    <rect x="205" y="120" width="26" height="40" fill="#0E9594"/>

    <rect x="140" y="270" width="52" height="52" fill="#FFFFFF" stroke="#1F2E2D" stroke-width="4"/>
    <line x1="166" y1="270" x2="166" y2="322" stroke="#1F2E2D" stroke-width="3"/>
    <line x1="140" y1="296" x2="192" y2="296" stroke="#1F2E2D" stroke-width="3"/>

    <rect x="268" y="290" width="46" height="90" fill="#4CAF6D"/>
    <rect x="286" y="290" width="10" height="90" fill="#3A8F57"/>

    <line x1="110" y1="380" x2="350" y2="380" stroke="#1F2E2D" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g stroke="#1F2E2D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="70" y1="140" x2="70" y2="380"/>
    <line x1="70" y1="140" x2="45" y2="165"/>
    <line x1="70" y1="200" x2="45" y2="225"/>
    <line x1="70" y1="140" x2="95" y2="140"/>
