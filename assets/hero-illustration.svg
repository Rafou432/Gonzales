    <path d="M-16 -46 h32 l-8 -22 h-16 Z" fill="#0E9594" stroke="#1F2E2D" stroke-width="3.5" stroke-linejoin="round"/>
  </g>

  <g fill="#4CAF6D">
    <circle cx="90" cy="90" r="6"/>
    <circle cx="430" cy="120" r="5"/>
